
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Vishnu Portfolio{% endblock %}</title>

    <meta name="description" content="Vishnu Vardhan - Python Full Stack Developer Portfolio">

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">
</head>

<body class="{{ theme }}-theme">

    <header class="header">
        <nav class="navbar">

            <a href="{{ url_for('home') }}" class="logo">
                Vishnu Vardhan Anumala
            </a>

            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}"
                    class="{% if request.url.path == '/' %}active{% endif %}">Home</a></li>

                <li><a href="{{ url_for('about') }}"
                    class="{% if request.url.path == '/about' %}active{% endif %}">About</a></li>

                <li><a href="{{ url_for('skills') }}"
                    class="{% if request.url.path == '/skills' %}active{% endif %}">Skills</a></li>

                <li><a href="{{ url_for('projects') }}"
                    class="{% if request.url.path == '/projects' %}active{% endif %}">Projects</a></li>

                <li><a href="{{ url_for('experience') }}"
                    class="{% if request.url.path == '/experience' %}active{% endif %}">Experience</a></li>

                <li><a href="{{ url_for('contact') }}"
                    class="{% if request.url.path == '/contact' %}active{% endif %}">Contact</a></li>
            </ul>

            <form action="/set-theme" method="POST">
                <button type="submit" class="theme-btn">
                    {% if theme == "light" %}
                        🌙 Dark
                    {% else %}
                        ☀️ Light
                    {% endif %}
                </button>
            </form>

        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Designed & Developed by <strong>Vishnu Vardhan Anumala</strong></p>
        <p>&copy; {{ year }} All Rights Reserved.</p>
    </footer>

</body>
</html>
